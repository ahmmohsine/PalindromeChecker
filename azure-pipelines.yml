trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '11.x'

  # Restore the NuGet packages
  - script: dotnet restore
    displayName: 'Restore NuGet packages'

  # Build in Release, without restoring again
  - script: dotnet build --configuration $(buildConfiguration) --no-restore
    displayName: 'Build'

  # Run the tests, without building again
  - script: dotnet test --configuration $(buildConfiguration) --no-build
    displayName: 'Run tests'

  # Publish ONLY the Desktop project into the staging folder
  - script: dotnet publish src/PalindromeChecker.Desktop/PalindromeChecker.Desktop.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
    displayName: 'Publish Desktop project'

  - task: PublishPipelineArtifact@1
    displayName: 'Upload artifact'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: 'PalindromeChecker.Desktop'